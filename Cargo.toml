[package]
name = "batates"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[package.metadata.bundle]
name = "batates"
identifier = "com.batates.app"
icon = ["assets/icon.ico"]

[dependencies]
# The curated "2d" collection pulls the sprite render stack, winit, and the
# platform defaults. Trimming it is deferred until the platform boundary lands,
# since the Linux backend will need a different feature set than macOS/Windows.
bevy = { version = "0.19", default-features = false, features = ["2d", "png"] }
# Seeded and injected so behaviour is reproducible in tests.
rand = "0.9"
rand_chacha = "0.9"
thiserror = "2"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
toml = "0.9"
directories = "6"
tray-icon = "0.24.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
interprocess = "2.4.3"
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
# Keep panic locations: "abort" turned every panic into SIGABRT, which is why
# quitting from anywhere but the window buttons looked like a crash.
strip = "debuginfo"
opt-level = "z"

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# tray-icon's Linux backend is built on gtk but does not initialize it or run
# its event loop itself; both are the embedding app's responsibility.
gtk = "0.18"
# Same version Bevy 0.19 vendors, so the surface this backend builds by hand
# is created with the exact same adapter/device the rest of the renderer uses.
wgpu = "29.0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
pollster = "0.4"
