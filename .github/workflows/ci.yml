name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures: the codebase is clippy-clean and should stay that way.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # Pinned rather than *-latest so a runner image bump cannot silently
        # change what is tested. macos-14 is deprecated; macos-15 is the oldest
        # GA image, which keeps the binary compatible with older macOS.
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Bevy needs the windowing and audio headers. tray-icon needs GTK and the
      # AppIndicator library for its StatusNotifierItem backend, and libxdo via
      # muda, its menu library. A missing libxdo only surfaces at link time, so
      # clippy passes and the first step that builds a binary fails instead.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test --all-targets

      # The binary must actually link, which `cargo test` does not prove for a
      # crate whose interesting code lives behind a windowing backend.
      - name: Build
        run: cargo build --release
