name: Release

on:
  push:
    tags: ["v*"]
  # Lets the packaging be exercised without cutting a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that does not match Cargo.toml would publish a release under the
  # wrong version. workflow_dispatch has no tag to check, so the compare step
  # only runs for an actual tag push; the job itself still succeeds either
  # way, so it does not block the no-tag "exercise packaging" path below.
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  macos:
    name: macOS universal
    needs: check-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Assemble the app bundle
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          APP="dist/Batates.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # A universal binary so one download runs on Intel and Apple silicon.
          lipo -create \
            target/aarch64-apple-darwin/release/batates \
            target/x86_64-apple-darwin/release/batates \
            -output "$APP/Contents/MacOS/batates"

          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          sed -i '' "s/__VERSION__/$VERSION/g" "$APP/Contents/Info.plist"
          cp assets/icon.png "$APP/Contents/Resources/icon.png"
          cp config.example.toml dist/

          hdiutil create -volname Batates -srcfolder dist -ov -format UDZO \
            "batates-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.dmg"

  windows:
    name: Windows x86_64
    needs: check-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # msvc rather than gnu: it matches the Win32 APIs the pointer module
          # links against and needs no mingw toolchain.
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mkdir -p "dist"
          cp target/x86_64-pc-windows-msvc/release/batates.exe dist/
          cp config.example.toml README.md LICENSE dist/
          7z a "batates-${VERSION}-x86_64-pc-windows-msvc.zip" ./dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  linux:
    name: Linux x86_64
    needs: check-version
    # Built on an older release so the binary runs against older glibc than the
    # build machine's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          mkdir -p "dist/skins"
          cp target/release/batates dist/
          cp config.example.toml README.md LICENSE dist/
          cp -r assets/skins/* dist/skins/
          cp packaging/linux/batates.desktop dist/
          tar -czf "batates-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  publish:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    # Only a tag produces a release; a manual run just builds the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.dmg
            *.zip
            *.tar.gz
          body: |
            Unsigned builds.

            macOS blocks unsigned apps on first launch. To allow it:

                xattr -dr com.apple.quarantine /Applications/Batates.app

            On Linux, batates requires a Wayland compositor supporting
            `zwlr_layer_shell_v1` (Sway, Hyprland, river, niri, KDE Plasma 6,
            COSMIC). GNOME is not supported.
